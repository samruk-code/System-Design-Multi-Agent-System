[project]
name = "system-design-multi-agent-system"
version = "0.1.0"
description = "A CrewAI multi-agent pipeline that produces comprehensive system design documents from a single prompt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.0",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
system-design = "system_design_multi_agent_system.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_design_multi_agent_system"]
